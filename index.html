<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flyer Evento</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
  }
  .flyer {
    width: 100vw;
    max-width: 480px;
    height: calc(100vw * 850 / 480);
    max-height: calc(480px * 850 / 480);
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #050510 0%, #0a0520 20%, #150010 50%, #1a0500 75%, #0a0000 100%);
  }
  #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .lightning { position: absolute; top: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .fire-container {
    position: absolute; bottom: 0; left: 0;
    width: 100%; height: 35%;
    z-index: 3; pointer-events: none;
  }
  .flame {
    position: absolute; bottom: 0;
    border-radius: 50% 50% 20% 20%;
    animation: burn linear infinite;
    transform-origin: bottom center;
  }
  @keyframes burn {
    0%   { transform: scaleY(1) scaleX(1) rotate(-2deg); opacity: 0.9; }
    25%  { transform: scaleY(1.15) scaleX(0.9) rotate(1deg); opacity: 1; }
    50%  { transform: scaleY(0.95) scaleX(1.1) rotate(-1deg); opacity: 0.85; }
    75%  { transform: scaleY(1.2) scaleX(0.85) rotate(2deg); opacity: 1; }
    100% { transform: scaleY(1) scaleX(1) rotate(-2deg); opacity: 0.9; }
  }
  .content {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center;
  }
 
  /* escala todo con vw para que sea responsive */
  .title-main {
    font-family: 'Cinzel', serif;
    font-size: min(11.25vw, 54px);
    font-weight: 900; letter-spacing: 0.12em;
    background: linear-gradient(180deg, #ffffff 0%, #ffd700 40%, #ff8800 70%, #cc4400 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 12px rgba(255,165,0,0.8));
    animation: shimmer 3s ease-in-out infinite;
    padding-top: min(3.75vw, 18px);
  }
  @keyframes shimmer {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255,165,0,0.6)); }
    50% { filter: drop-shadow(0 0 20px rgba(255,200,0,1)) drop-shadow(0 0 40px rgba(255,100,0,0.5)); }
  }
 
  .wings-wrap {
    position: relative;
    width: min(79.2vw, 380px);
    height: min(33.3vw, 160px);
    margin-top: min(-1.7vw, -8px);
  }
  .wings-wrap svg.wings-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
 
  .badge-wrap {
    position: absolute;
    top: min(3.75vw, 18px);
    left: 50%; transform: translateX(-50%);
    width: min(41.7vw, 200px);
    height: min(41.7vw, 200px);
    display: flex; align-items: center; justify-content: center;
  }
  .badge-wrap svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
 
  .streamer-photo {
    width: min(31.25vw, 150px);
    height: min(31.25vw, 150px);
    border-radius: 50%; overflow: hidden;
    position: relative; z-index: 2;
    border: 3px solid #ffd700;
    animation: glowPulse 2s ease-in-out infinite;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: min(8.3vw, 40px); font-weight: 900; color: #ffd700;
  }
  .streamer-photo img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 15px #ffd700, 0 0 30px rgba(255,140,0,0.4); }
    50% { box-shadow: 0 0 25px #ffd700, 0 0 50px rgba(255,140,0,0.7), 0 0 70px rgba(255,80,0,0.3); }
  }
 
  .name-block {
    margin-top: min(17vw, 82px);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .streamer-name {
    font-family: 'Cinzel', serif;
    font-size: min(6.25vw, 30px);
    font-weight: 900; letter-spacing: 0.2em;
    background: linear-gradient(135deg, #4db8ff, #1e90ff, #0055cc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 8px rgba(30,144,255,0.8));
  }
  .goal-badge {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,140,0,0.1));
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 20px; padding: 3px 14px; margin-top: 4px;
  }
  .goal-text { font-family: 'Rajdhani', sans-serif; font-size: min(2.7vw, 13px); font-weight: 600; color: #ffd700; letter-spacing: 2px; text-transform: uppercase; }
  .goal-num { font-family: 'Cinzel', serif; font-size: min(3.75vw, 18px); font-weight: 900; color: #ffd700; text-shadow: 0 0 10px #ffd700; }
 
  .divider {
    width: 80%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), rgba(255,80,0,0.5), transparent);
    margin: min(1.7vw, 8px) 0;
  }
  .date-label {
    font-family: 'Cinzel', serif;
    font-size: min(5vw, 24px);
    font-weight: 700; color: #fff; letter-spacing: 0.12em;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
    margin-bottom: min(1.25vw, 6px);
  }
 
  .schedules { display: flex; flex-direction: column; gap: 3px; width: 82%; }
  .schedule-row {
    display: flex; align-items: center; gap: min(2vw, 10px);
    padding: min(1vw, 5px) min(2.9vw, 14px);
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
  }
  .flags { font-size: min(3.5vw, 17px); min-width: min(9vw, 44px); }
  .country-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: min(2.7vw, 13px);
    font-weight: 700; letter-spacing: 1px;
    min-width: min(11.5vw, 55px);
  }
  .time {
    font-family: 'Cinzel', serif;
    font-size: min(3.5vw, 17px);
    font-weight: 700;
  }
 
  /* ANFITRIONA absoluta */
  .host-section {
    position: absolute;
    bottom: min(25vw, 120px);
    right: min(3.75vw, 18px);
    z-index: 20;
    display: flex; flex-direction: column; align-items: center;
  }
  .host-photo-wrap {
    position: relative;
    width: min(22.9vw, 110px);
    height: min(22.9vw, 110px);
    display: flex; align-items: center; justify-content: center;
  }
  .host-photo {
    width: min(20.8vw, 100px);
    height: min(20.8vw, 100px);
    border-radius: 50%; overflow: hidden;
    border: 3px solid #ff00ff;
    box-shadow: 0 0 25px #ff00ff, 0 0 50px rgba(255,0,255,0.7), 0 0 80px rgba(200,0,255,0.4);
    animation: hostGlow 2s ease-in-out infinite;
    background: linear-gradient(135deg, #2a0040, #1a0030);
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
  }
  .host-photo img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes hostGlow {
    0%, 100% { box-shadow: 0 0 20px #ff00ff, 0 0 40px rgba(255,0,255,0.6); }
    50% { box-shadow: 0 0 40px #ff00ff, 0 0 80px rgba(255,0,255,1), 0 0 110px rgba(200,0,255,0.6); }
  }
  .host-ring-svg {
    position: absolute; top: -10px; left: -10px;
    width: min(27vw, 130px); height: min(27vw, 130px); z-index: 1;
  }
  .host-label {
    font-family: 'Cinzel', serif;
    font-size: min(3.1vw, 15px);
    font-weight: 900; color: #ff00ff; letter-spacing: 2px;
    text-shadow: 0 0 12px #ff00ff, 0 0 25px rgba(255,0,255,0.9);
    margin-top: 5px; text-align: center;
    animation: hostTextGlow 2s ease-in-out infinite;
  }
  @keyframes hostTextGlow {
    0%, 100% { text-shadow: 0 0 10px #ff00ff, 0 0 20px rgba(255,0,255,0.6); }
    50% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px rgba(255,0,255,0.7); }
  }
  .host-sublabel {
    font-family: 'Rajdhani', sans-serif;
    font-size: min(2.3vw, 11px);
    font-weight: 700; color: #ff88ff; letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 0 6px rgba(255,100,255,0.8); text-align: center;
  }
 
  .bottom-glow {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 80px;
    background: linear-gradient(0deg, rgba(255,50,0,0.3), transparent);
    z-index: 4; pointer-events: none;
  }
  .sparkle {
    position: absolute; bottom: 20px; left: 20px;
    font-size: 20px; color: #fff; opacity: 0.6; z-index: 20;
    animation: twinkle 2s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.3); }
  }
</style>
</head>
<body>
<div class="flyer">

          <path d="M190,80 C150,75 110,70 80,72 C55,74 30,80 10,88 C40,90 75,88 105,87 C135,86 165,84 185,83Z" fill="#3388ff" opacity="0.6"/>
          <path d="M190,82 C160,85 125,90 100,96 C75,102 50,108 25,110 C50,106 80,100 108,96 C136,92 165,88 185,86Z" fill="#55aaff" opacity="0.5"/>
          <path d="M190,80 C170,70 145,58 118,52" fill="none" stroke="#88ccff" stroke-width="1.5" opacity="0.6"/>
          <path d="M190,80 C168,74 140,66 112,63" fill="none" stroke="#88ccff" stroke-width="1" opacity="0.5"/>
        </g>
        <g opacity="0.9">
          <path d="M190,80 C220,60 260,30 300,20 C330,12 360,18 375,30 C350,45 320,55 295,65 C270,75 240,80 220,82Z" fill="#cc3300" opacity="0.8"/>
          <path d="M190,80 C225,65 270,45 310,45 C340,45 365,55 375,65 C345,72 315,75 285,78 C255,81 220,82 200,83Z" fill="#ee5511" opacity="0.7"/>
          <path d="M190,80 C230,75 270,70 300,72 C325,74 350,80 370,88 C340,90 305,88 275,87 C245,86 215,84 195,83Z" fill="#ff7722" opacity="0.6"/>
          <path d="M190,82 C220,85 255,90 280,96 C305,102 330,108 355,110 C330,106 300,100 272,96 C244,92 215,88 195,86Z" fill="#ffaa44" opacity="0.5"/>
          <path d="M190,80 C210,70 235,58 262,52" fill="none" stroke="#ffcc88" stroke-width="1.5" opacity="0.6"/>
          <path d="M190,80 C212,74 240,66 268,63" fill="none" stroke="#ffcc88" stroke-width="1" opacity="0.5"/>

          <circle cx="100" cy="100" r="88" fill="rgba(0,0,0,0.5)" stroke="#cc8800" stroke-width="1" opacity="0.5"/>

      <div class="schedule-row" style="border-left:2px solid #ff00aa; background:rgba(255,0,170,0.05);">

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
 
const particles = [];
for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * 480, y: Math.random() * 850,
    size: Math.random() * 2 + 0.5,
    speedY: -(Math.random() * 0.8 + 0.2),
    speedX: (Math.random() - 0.5) * 0.4,
    opacity: Math.random(),
    color: Math.random() > 0.5
      ? `rgba(255,${Math.floor(Math.random()*100+80)},0,`
      : `rgba(${Math.floor(Math.random()*50+150)},${Math.floor(Math.random()*80+100)},255,`
  });
}
function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const scaleX = canvas.width / 480;
  const scaleY = canvas.height / 850;
  for (const p of particles) {
    p.y += p.speedY; p.x += p.speedX; p.opacity -= 0.003;
    if (p.y < 0 || p.opacity <= 0) {
      p.y = 850; p.x = Math.random() * 480;
      p.opacity = Math.random() * 0.7 + 0.3;
    }
    ctx.beginPath();
    ctx.arc(p.x * scaleX, p.y * scaleY, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color + p.opacity + ')';
    ctx.fill();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();
 
const fireContainer = document.getElementById('fireContainer');
const flameData = [
  {left:'3%',w:'12%',h:'60%',c1:'#ff2200',c2:'#ff6600',dur:1.6},
  {left:'10%',w:'9%',h:'47%',c1:'#ff4400',c2:'#ffaa00',dur:1.9},
  {left:'18%',w:'14%',h:'67%',c1:'#ff1100',c2:'#ff5500',dur:1.4},
  {left:'28%',w:'10%',h:'53%',c1:'#ff3300',c2:'#ff8800',dur:2.1},
  {left:'38%',w:'16%',h:'73%',c1:'#ff2200',c2:'#ffcc00',dur:1.7},
  {left:'48%',w:'11%',h:'57%',c1:'#ff4400',c2:'#ff7700',dur:1.5},
  {left:'57%',w:'15%',h:'67%',c1:'#ff1100',c2:'#ff5500',dur:1.8},
